name: research-artifact-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check src tests
      - run: python -m pytest
      - run: python -m src.experiments --seeds 2 --jobs 40 --hours 72 --results-dir scratch/results --figures-dir scratch/figures
